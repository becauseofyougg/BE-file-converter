name: file-converter

x-database-defaults: &database-defaults
  # Prisma connects by URL. Each service gets its own database — the full URL
  # is set per service below, since the database name is the part that differs.
  DATABASE_LOG_QUERIES: ${DATABASE_LOG_QUERIES:-false}

x-s3-credentials: &s3-credentials
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_BUCKET_UPLOADS: uploads
  S3_BUCKET_RESULTS: results
  S3_FORCE_PATH_STYLE: "true"

x-service-defaults: &service-defaults
  restart: unless-stopped
  environment: &service-environment
    NODE_ENV: ${NODE_ENV:-development}
    LOG_LEVEL: ${LOG_LEVEL:-debug}
    HEALTH_CHECK_ENABLED: "true"
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
    RABBITMQ_PREFETCH: "1"
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  # --------------------------------------------------------------- infra ----
  postgres:
    image: postgres:18-alpine
    container_name: fc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      # Pinned to where the volume is mounted. Newer 18.x images default to a
      # versioned subdirectory and refuse to start when data sits at the old
      # path — which is where every volume this stack has created so far keeps it.
      PGDATA: /var/lib/postgresql/data
    ports:
      # Override with POSTGRES_PORT when a local Postgres already holds 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: fc-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  # MinIO stopped publishing images: `minio/minio` and `minio/mc` are gone from
  # Docker Hub and quay.io, and pulling either fails. Chainguard builds the same
  # server from source and publishes it. The code only speaks S3, so any
  # S3-compatible server would do — this one keeps the MinIO console as well.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: fc-minio
    command: server /data --console-address ":9001"
    # The image runs as uid 65532, and a fresh named volume is owned by root,
    # so the server cannot write to it. Root is acceptable for a local S3
    # emulator; the application containers still run as `node`.
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    # No healthcheck: the image is distroless, with no shell or client to run
    # one. `minio-init` waits for the API instead, and whatever needs storage
    # waits for `minio-init` — which is the stronger guarantee anyway, since
    # it means the buckets exist too.

  # Waits for the S3 API, creates the two private buckets, then exits.
  minio-init:
    image: amazon/aws-cli:latest
    container_name: fc-minio-init
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
    entrypoint: >
      /bin/sh -c "
      for attempt in $$(seq 1 60); do
        aws s3api list-buckets > /dev/null 2>&1 && break;
        [ $$attempt -eq 60 ] && echo 'storage never came up' && exit 1;
        sleep 1;
      done;
      for bucket in uploads results; do
        aws s3api head-bucket --bucket $$bucket 2> /dev/null ||
          aws s3api create-bucket --bucket $$bucket > /dev/null || exit 1;
      done;
      echo 'buckets ready'
      "

  # Catches all SMTP in development, so no real mail provider is needed.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: fc-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  # ------------------------------------------------------------ services ----
  api-gateway:
    <<: *service-defaults
    container_name: fc-api-gateway
    build:
      context: .
      dockerfile: docker/api-gateway.Dockerfile
    environment:
      <<: [*service-environment, *s3-credentials]
      SERVICE_NAME: api-gateway
      PORT: 3000
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me}
      # The same secret identity signs with: the gateway verifies tokens
      # locally, which is what keeps an RPC off every authenticated request.
      JWT_SECRET: ${JWT_SECRET:-change-me-to-at-least-32-characters-long}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://localhost:4200}
      THROTTLE_GLOBAL_TTL: 10000
      THROTTLE_GLOBAL_LIMIT: 100
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      # Not just the server: the buckets, which minio-init creates.
      minio-init:
        condition: service_completed_successfully

  identity-service:
    <<: *service-defaults
    container_name: fc-identity-service
    build:
      context: .
      dockerfile: docker/identity-service.Dockerfile
    environment:
      <<: [*service-environment, *database-defaults]
      SERVICE_NAME: identity-service
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/identity
      JWT_SECRET: ${JWT_SECRET:-change-me-to-at-least-32-characters-long}
      # A different secret from the access token's, and only identity holds it:
      # the gateway can check an access token, but never mint a session.
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too-and-not-to-the-same-value}
      AUTH_CONFIRM_REGISTRATION: ${AUTH_CONFIRM_REGISTRATION:-true}
      AUTH_CONFIRM_METHOD: ${AUTH_CONFIRM_METHOD:-otp}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Scale with: docker compose up --scale conversion-service=5
  conversion-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/conversion-service.Dockerfile
      args:
        # Empty for the pure-Node image family; set per family when a
        # heavyweight engine lands (ffmpeg, libreoffice).
        CONVERTER_PACKAGES: ""
    environment:
      <<: [*service-environment, *database-defaults, *s3-credentials]
      SERVICE_NAME: conversion-service
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/conversion
      CONVERSION_FAMILY: ${CONVERSION_FAMILY:-image}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Not just the server: the buckets, which minio-init creates.
      minio-init:
        condition: service_completed_successfully

  notification-service:
    <<: *service-defaults
    container_name: fc-notification-service
    build:
      context: .
      dockerfile: docker/notification-service.Dockerfile
    environment:
      <<: [*service-environment, *database-defaults]
      SERVICE_NAME: notification-service
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/notification
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-no-reply@file-converter.local}
      # The frontend, not the gateway: a magic link opens a page that posts the
      # token to the API, and the API has no GET route for it to land on.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5174}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
